<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SANDO で予定を開く</title>
<style>
  body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;
       background:#F9E8E4;color:#3A3A3A;display:flex;min-height:100vh;
       align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
  .card{background:#fff;border-radius:20px;padding:32px 24px;max-width:360px;width:100%;
        text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06)}
  h1{font-size:20px;margin:0 0 8px}
  p{font-size:14px;color:#7A7A7A;margin:0 0 24px;line-height:1.7}
  a{display:block;text-decoration:none;border-radius:12px;padding:14px;
    font-size:15px;font-weight:bold;margin-bottom:10px}
  .primary{background:#C0392B;color:#fff}
  .secondary{background:#F2F2F2;color:#3A3A3A}
</style>
</head>
<body>
<div class="card">
  <h1>⛩ SANDO</h1>
  <p>共有された予定を開きます。<br>アプリが開かない場合は、下のボタンからダウンロードしてください。</p>
  <a class="primary" id="open" href="#">アプリで開く</a>
  <a class="secondary" href="https://apps.apple.com/jp/app/id0000000000">App Store でダウンロード</a>
</div>
<script>
  var q = location.search || "";
  var appURL = "sando://plan" + q;
  document.getElementById("open").href = appURL;
  // アプリがあれば自動で開く
  setTimeout(function(){ location.href = appURL; }, 100);
</script>
</body>
</html>
